name: Import Arden plugin files
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-arden.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import the verified release archive
        env:
          ARCHIVE_URL: https://github.com/moshoutegong/DragonUI-Arden/releases/download/v4.1.1-Arden/DragonUI-Arden-4.1.1.zip
          ARCHIVE_SHA: 00fb16ccf787f542ec14470ca51522baf30b483384026ff7bf0308d6d605e69c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arden.zip"
          extracted="$RUNNER_TEMP/arden"
          curl --fail --location --retry 3 --output "$archive" "$ARCHIVE_URL"
          printf '%s  %s\n' "$ARCHIVE_SHA" "$archive" | sha256sum --check
          python3 - "$archive" "$extracted" <<'PY'
          import shutil
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          with zipfile.ZipFile(sys.argv[1]) as archive:
              for entry in archive.infolist():
                  name = PurePosixPath(entry.filename.replace(chr(92), "/"))
                  if entry.is_dir() or not name.parts or name.parts[0] not in {"DragonUI", "DragonUI_Options"}:
                      continue
                  if ".." in name.parts:
                      raise ValueError(f"Unexpected ZIP path: {name}")
                  target = Path(sys.argv[2]).joinpath(*name.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(entry) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)
          PY
          test -f "$extracted/DragonUI/DragonUI.toc"
          test -f "$extracted/DragonUI_Options/DragonUI_Options.toc"
          test ! -e DragonUI
          test ! -e DragonUI_Options
          mv "$extracted/DragonUI" "$extracted/DragonUI_Options" .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-arden.yml
          git add -- DragonUI DragonUI_Options
          test "$(git write-tree --prefix=DragonUI/)" = 7716f2aa4164a14485f6e80ef748050943e35dd3
          test "$(git write-tree --prefix=DragonUI_Options/)" = 2bedb3bb08ef7ba33ddb72cd540eab6b8b668e2d
          git commit -m '导入 DragonUI-Arden 插件源码'
          git push origin HEAD:main
